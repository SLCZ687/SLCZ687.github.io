name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!content/**"
  repository_dispatch:
    types: [vault-updated]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Allow GitHub Pages deployment via GitHub Pages Bot
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v7

      - name: Checkout private vault
        uses: actions/checkout@v7
        with:
          repository: SLCZ687/KnowledgeBase
          token: ${{ secrets.VAULT_TOKEN }}
          path: content

      - name: Restore previous vault SHA
        id: vault-sha-cache
        uses: actions/cache@v6
        with:
          path: .vault-sha
          key: vault-sha-${{ github.run_id }}
          restore-keys: vault-sha-

      - name: Check if vault changed since last deploy
        id: check
        run: |
          cur=$(git -C content rev-parse HEAD)
          prev=$(cat .vault-sha 2>/dev/null || echo "")
          echo "vault current:  $cur"
          echo "vault previous: ${prev:-<none>}"
          if [ -n "$prev" ] && [ "$cur" = "$prev" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$cur" > .vault-sha

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
